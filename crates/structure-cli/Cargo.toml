[package]
name = "structure-cli"
description = "Command line compiler and runtime for IEC 61131-3 programs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "structure"
path = "src/main.rs"

[dependencies]
structure-syntax = { path = "../structure-syntax" }
structure-compiler = { path = "../structure-compiler" }
structure-runtime = { path = "../structure-runtime" }
structure-drivers = { path = "../structure-drivers" }
ctrlc = "3"
clap = { version = "4", features = ["derive"] }
